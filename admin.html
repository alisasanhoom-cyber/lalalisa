<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Tracker | MP Models</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="180x180" href="images/mp-mark-180.png?v=3">
  <link rel="icon" type="image/png" sizes="64x64" href="images/mp-mark-64.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="images/mp-mark-32.png?v=3">
  <link rel="apple-touch-icon" href="images/mp-mark-180.png?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root{
      --teal:#1b998b; --ink:#1a1a1a; --grey:#6b6b6b; --line:#e6e6e6; --bg:#f4f5f7;
      --pending:#d98a00; --confirmed:#1b998b; --declined:#c0392b; --completed:#555; --web:#7b5ea7;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Open Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    a{color:var(--teal)}
    button{font-family:inherit}

    /* Login */
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:40px;width:100%;max-width:380px;text-align:center}
    .login-card img{height:44px;margin-bottom:20px}
    .login-card h1{font-family:'Playfair Display',serif;font-size:22px;margin:0 0 6px}
    .login-card p{color:var(--grey);font-size:13px;margin:0 0 24px}
    .login-card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:12px}
    .pw-wrap{position:relative}
    .pw-wrap input{margin-bottom:12px}
    .pw-toggle{position:absolute;right:8px;top:11px;background:none;border:none;color:var(--grey);font-size:12px;cursor:pointer;padding:4px 6px}
    .btn{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
    .btn:hover{opacity:.9}
    .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
    .login-err{color:var(--declined);font-size:13px;min-height:18px;margin:4px 0 0}

    /* Shell */
    .app{display:none}
    .topbar{background:var(--ink);color:#fff;padding:0 24px;display:flex;align-items:center;gap:8px;height:56px}
    .topbar .brand{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;margin-right:18px}
    .topbar .brand span{color:var(--teal)}
    .topbar .brand-logo{height:30px;width:auto;margin-right:18px;display:block}
    .tab{background:none;border:none;color:#bbb;font-size:14px;padding:18px 14px;cursor:pointer;border-bottom:3px solid transparent}
    .tab.active{color:#fff;border-bottom-color:var(--teal)}
    .topbar .spacer{flex:1}
    .topbar .logout{color:#bbb;font-size:13px;cursor:pointer;background:none;border:none}
    .topbar .logout:hover{color:#fff}

    .wrap{max-width:1280px;margin:0 auto;padding:22px}

    /* Controls */
    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
    .controls select,.controls input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
    .controls input[type=search]{min-width:200px}
    .controls .right{margin-left:auto;display:flex;gap:8px}
    .bulk-tag{display:inline-flex;gap:6px;align-items:center;padding-left:8px;border-left:1px solid var(--line)}
    .bulk-tag select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
    .link{color:var(--grey);cursor:pointer;background:none;border:none;font-size:13px}

    /* Stats */
    /* one clear row: equal-width tiles, scroll only if the screen is very narrow */
    .stats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(120px,1fr);gap:10px;margin-bottom:18px;overflow-x:auto}
    .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;min-width:0}
    .stat .n{font-size:20px;font-weight:700;line-height:1;white-space:nowrap}
    .stat .l{font-size:10.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
    .stat.money .n{color:var(--teal);font-size:16px}
    .stat.money.nontax .n{color:var(--web)}
    .stat.pending .n{color:var(--pending)}

    /* Bookers see each job's own fee, but NOT the aggregate revenue totals */
    body.role-booker .revenue-only{display:none !important}
    /* Manager-only features (activity log) — hidden from bookers */
    body.role-booker .manager-only{display:none !important}
    /* Graphic designer: sees jobs/schedule to find shoots, but NO money anywhere */
    body.role-designer .revenue-only,
    body.role-designer .manager-only,
    body.role-designer .money{display:none !important}
    /* Photos/videos status is for the graphic team + managers — bookers never see it */
    body.role-booker .materials-box,
    body.role-booker .mat-badge{display:none !important}

    /* Photos/videos (graphic team) */
    .materials-box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:4px 0 16px;background:#f7fbfa}
    .materials-head{font-weight:700;font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
    .materials-head span{font-weight:500;font-size:11px;color:var(--grey);background:#eef2f0;border:1px solid var(--line);padding:2px 8px;border-radius:999px}
    .mat-badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;vertical-align:middle}
    .mat-badge.mat-search{background:#fdf3e0;color:#a9701a;border:1px solid #f0dcb0}
    .mat-badge.mat-found{background:#e7f4ec;color:#1f7a44;border:1px solid #bfe0cd}
    .mat-badge.mat-done{background:#e6f1f0;color:#236b62;border:1px solid #bfe0da}
    .dup-warn{background:#fdf3e0;color:#9a5b12;border:1px solid #f0dcb0;border-radius:8px;padding:9px 12px;font-size:12.5px;margin:-4px 0 12px}
    /* Declined / Postponed history */
    .hist-pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
    .hist-pill.declined{background:#fbe8e6;color:#c74436;border:1px solid #f0c8c2}
    .hist-pill.postponed{background:#fdf3e0;color:#a9701a;border:1px solid #f0dcb0}
    .hist-type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--grey);background:#eef2f0;border:1px solid var(--line);padding:1px 6px;border-radius:5px;margin-right:5px}
    .hist-pp{margin-top:5px;font-size:12px;color:var(--grey)}
    .hist-pp input{padding:4px 7px;border:1px solid var(--line2);border-radius:6px;font-size:12px}

    /* Table */
    .card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
    th{text-align:left;padding:11px 12px;background:#fafafa;border-bottom:1px solid var(--line);
      font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--grey);white-space:nowrap}
    td{padding:10px 12px;border-bottom:1px solid #f2f2f2;vertical-align:top}
    tr:last-child td{border-bottom:none}
    .th-sub{font-weight:400;font-size:9px;color:var(--grey);text-transform:none;letter-spacing:0}
    .code-dash{color:var(--line2)}
    td.code-b{color:var(--web)}
    tr.row{cursor:pointer}
    tr.row:hover{background:#fbfbfb}
    tr.web{background:#faf7fd}
    .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
    .title-cell{font-weight:600;max-width:260px}
    .sub{color:var(--grey);font-size:11.5px;margin-top:2px}
    .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#fff}
    .badge.pending{background:var(--pending)} .badge.confirmed{background:var(--confirmed)}
    .badge.declined{background:var(--declined)} .badge.completed{background:var(--completed)}
    .badge.web{background:var(--web)}
    .status-select{padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer}
    .empty{padding:44px;text-align:center;color:var(--grey)}

    /* Schedule */
    .day{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
    .day-head{background:#fafafa;padding:9px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line)}
    .sched-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr 1fr auto;gap:10px;padding:10px 14px;border-bottom:1px solid #f2f2f2;font-size:12.5px}
    .sched-row:last-child{border-bottom:none}
    .sched-row .k{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--grey);margin-bottom:2px;display:none}
    .sched-col b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--grey);margin-bottom:3px;font-weight:700}
    .sched-col{white-space:pre-wrap}
    .sched-cast{color:#8a6d00} .sched-opt{color:var(--web)} .sched-job{color:var(--teal)}
    .sched-fit{color:#6366f1}
    .sched-note{color:#555} .sched-short{color:#d33;font-weight:600} .sched-prio{color:#e67e22;font-weight:600}
    .sched-inote{color:#236b62;background:#eef5f3;border-radius:6px;padding:5px 7px}
    .day-entry .line.sched-inote{color:#236b62;background:#eef5f3}
    .note-dot{font-size:11px}
    .field.int-note textarea{background:#f2f8f6;border-color:#cfe3dd}

    /* Schedule BOARD (drag-and-drop pipeline) */
    .board{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;align-items:flex-start}
    .board-col{flex:0 0 240px;background:#f6f6f4;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:70vh}
    .board-col.drop-hot{outline:2px dashed var(--teal);outline-offset:-2px;background:#eef5f3}
    .board-col-head{display:flex;align-items:center;gap:7px;padding:11px 13px;font-weight:700;font-size:12.5px;border-bottom:1px solid var(--line);position:sticky;top:0}
    .board-col-head .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
    .board-col-head .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--grey);background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
    .board-cards{padding:9px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
    .bcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:9px;padding:10px 11px;cursor:grab;font-size:12.5px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .bcard:active{cursor:grabbing}
    .bcard.dragging{opacity:.45}
    .bcard .b-subj{font-weight:700;margin-bottom:2px}
    .bcard .b-models{color:var(--ink)}
    .bcard .b-meta{color:var(--grey);font-size:11px;margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .bcard .b-book{background:#eef2f0;border-radius:999px;padding:1px 7px;font-weight:600}
    .bcard .b-time{font-weight:700;color:var(--ink)}
    .bcard .b-pp{font-size:11px;color:#a9701a;font-weight:600;margin-top:3px}
    .bcard .b-hold{color:var(--web);font-weight:700}
    .board-empty{color:var(--faint,#9aa19d);font-size:11px;text-align:center;padding:10px 0}
    .board-hint{font-size:11.5px;color:var(--grey);margin:0 0 10px}
    @media (max-width:640px){ .board-col{flex-basis:200px} }
    .day-entry .line.sched-note{color:#333}
    .short-warn{background:#fdecec;border:1px solid #f5b5b5;border-radius:6px;padding:6px 8px;margin-top:5px;color:#a11;font-size:11.5px;font-weight:400}
    .conflict-box{border-radius:8px;padding:9px 11px;margin-bottom:12px;font-size:12.5px;line-height:1.55}
    .conflict-box.hard{background:#fdecec;border:1px solid #e0a0a0;color:#7a2a2a}
    .conflict-box.soft{background:#f4f6f8;border:1px solid var(--line);color:#555}
    .conflict-box b{display:block;margin-bottom:3px}
    .conflict-box.hard b{color:#a11} .conflict-box.soft b{color:#555}
    .c-hard{color:#c0392b;font-weight:600} .c-soft{color:#777}
    .prio-warn{background:#fff2e6;border:1px solid #f5c99b;border-radius:6px;padding:6px 8px;margin-top:5px;color:#9c5010;font-size:11.5px;font-weight:400}
    .cat-btn.active[data-cat=shortlist]{background:#d33;border-color:#d33;color:#fff}
    .cat-btn.active[data-cat=priority]{background:#e67e22;border-color:#e67e22;color:#fff}
    .inline-booker{padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:11px;font-family:inherit;background:#fff;max-width:110px}
    .inline-booker.untagged{border-color:var(--pending);background:#fff8ec}
    .inline-status{padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:11px;font-family:inherit;background:#fff;font-weight:700}
    .inline-status.st-open{color:var(--grey)}
    .inline-status.st-confirmed{color:var(--confirmed);border-color:var(--confirmed)}
    .inline-status.st-postponed{color:var(--pending);border-color:var(--pending)}
    .inline-status.st-declined{color:var(--declined);border-color:var(--declined)}
    .sched-booker-wrap{font-size:10px;color:var(--grey);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}

    /* Drawer */
    .drawer-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
    .drawer-bg.open{display:block}
    .drawer{position:fixed;top:0;right:0;height:100%;width:100%;max-width:460px;background:#fff;z-index:51;
      transform:translateX(100%);transition:transform .22s;overflow-y:auto;display:none}
    .drawer.open{display:block;transform:translateX(0)}
    .drawer-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
    .drawer-head h2{margin:0;font-size:17px}
    .drawer-head .x{margin-left:auto;background:none;border:none;font-size:22px;cursor:pointer;color:var(--grey)}
    .drawer-body{padding:20px 22px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--grey);margin-bottom:4px}
    .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
    .field.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .drawer-actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
    .drawer-actions select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}

    /* Client & confirmation details (collapsible) */
    .cd{border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#fafafa}
    .cd summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px}
    .cd summary::-webkit-details-marker{display:none}
    .cd summary::before{content:'▸';color:var(--grey);font-size:11px}
    .cd[open] summary::before{content:'▾'}
    .cd-count{background:var(--teal);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
    .cd-hint{color:var(--grey);font-weight:400;font-size:11.5px}
    .cd-body{padding:4px 14px 14px}
    .cd-group-title{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--web);font-weight:700;margin:14px 0 6px}
    /* Schedule category chooser */
    .cat-btns{display:flex;gap:8px;flex-wrap:wrap}
    .cat-btn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--grey)}
    .cat-btn:hover{border-color:var(--teal)}
    .cat-btn.active[data-cat=casting]{background:#b8860b;border-color:#b8860b;color:#fff}
    .cat-btn.active[data-cat=fitting]{background:#6366f1;border-color:#6366f1;color:#fff}
    .cat-btn.active[data-cat=option]{background:var(--web);border-color:var(--web);color:#fff}
    .cat-btn.active[data-cat=job]{background:var(--teal);border-color:var(--teal);color:#fff}
    .cat-btn.active[data-cat=shooting]{background:#22a06b;border-color:#22a06b;color:#fff}
    .cat-btn.active[data-cat=goandsee]{background:#0d9488;border-color:#0d9488;color:#fff}
    .ot-box{background:#fff;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:12.5px;color:var(--grey)}
    .ot-box.has-ot{border-style:solid;border-color:var(--pending);background:#fff8ec;color:var(--ink)}
    .ot-box b{color:var(--ink)}

    /* Calendar / List toggle */
    .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
    .seg-btn{background:#fff;border:none;padding:9px 14px;font-size:13px;cursor:pointer;color:var(--grey)}
    .seg-btn.active{background:var(--ink);color:#fff}

    /* Calendar */
    .cal-nav{display:flex;align-items:center;gap:10px;margin:0 0 12px}
    .cal-nav .cal-title{margin:0;min-width:150px;text-align:center}
    .cal-nav .cal-prev,.cal-nav .cal-next{font-size:22px;line-height:1;padding:0 8px;font-weight:700}
    .cal-nav .cal-today{margin-left:6px;font-size:12px}
    .cal-title{font-weight:700;font-size:15px;margin:0 0 12px}
    .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .cal-dow{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--grey);text-align:center;padding:4px 0;font-weight:700}
    .cal-cell{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:104px;padding:6px;cursor:pointer;overflow:hidden}
    .cal-cell.empty{background:transparent;border:none;cursor:default}
    .cal-cell:hover:not(.empty){border-color:var(--teal)}
    .cal-cell.today{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
    .cal-date{font-weight:700;font-size:12px;margin-bottom:4px;color:var(--ink)}
    .cal-chip{display:block;border-radius:4px;padding:2px 5px;margin-bottom:3px;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;color:#fff;font-size:10.5px}
    .cal-chip.cast{background:#b8860b} .cal-chip.opt{background:var(--web)} .cal-chip.job{background:var(--teal)}
    .cal-chip.fit{background:#6366f1}
    .cal-chip.note{background:#6b6b6b} .cal-chip.short{background:#d33;font-weight:700} .cal-chip.prio{background:#e67e22;font-weight:700}
    .cal-who{font-weight:800;background:rgba(255,255,255,.28);border-radius:3px;padding:0 3px;font-size:9.5px}
    .cal-chip.declined{opacity:.4;text-decoration:line-through}
    /* Mini date picker (multi-select option hold days) */
    .mini-cal{border:1px solid var(--line);border-radius:10px;padding:10px;max-width:320px}
    .mc-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:6px}
    .mc-nav{background:#f2f2f2;border:none;border-radius:6px;width:26px;height:26px;font-size:16px;cursor:pointer}
    .mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
    .mc-dow{text-align:center;font-size:10px;color:var(--grey);font-weight:700;padding:2px 0}
    .mc-cell{text-align:center;padding:7px 0;font-size:13px;border-radius:7px;cursor:pointer;user-select:none;border:1px solid transparent}
    .mc-cell:hover:not(.empty){background:#eef6f4}
    .mc-cell.empty{cursor:default}
    .mc-cell.picked{background:var(--teal);color:#fff;font-weight:700}
    /* Stage-painted days (Add schedule entry) */
    .mc-cell.st-casting{background:#b8860b;color:#fff;font-weight:700}
    .mc-cell.st-fitting{background:#6366f1;color:#fff;font-weight:700}
    .mc-cell.st-shooting{background:#22a06b;color:#fff;font-weight:700}
    .mc-cell.st-option{background:var(--web);color:#fff;font-weight:700}
    .mc-cell.st-shortlist{background:#d33;color:#fff;font-weight:700}
    .mc-cell.st-priority{background:#e67e22;color:#fff;font-weight:700}
    .mc-cell.st-goandsee{background:#0d9488;color:#fff;font-weight:700}
    .picked-summary{font-size:12.5px;margin-top:8px;line-height:1.5}
    /* Tomorrow reminder — floating help-box bubble (bottom-left) */
    #rem-launcher{position:fixed;left:20px;bottom:20px;z-index:45}
    .rem-fab{display:flex;align-items:center;justify-content:center;gap:0;width:56px;height:56px;border-radius:50%;
      background:var(--teal);color:#fff;border:none;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);position:relative}
    .rem-fab-bell{font-size:24px;line-height:1}
    .rem-fab-badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;
      background:#e0245e;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
    .rem-fab-badge.zero{display:none}
    .rem-pop{position:absolute;left:0;bottom:70px;width:min(440px,calc(100vw - 40px));max-height:70vh;overflow-y:auto;
      background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
    .rem-pop-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);
      font-weight:700;position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0}
    .rem-pop-head .x{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--grey)}
    .rem-panel{padding:12px 16px}
    .rem-panel.done{background:#eafaf1}
    .rem-head{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px;font-size:14px;flex-wrap:wrap}
    .rem-badge{background:#e67e22;color:#fff;border-radius:12px;padding:1px 9px;font-size:12px}
    .rem-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid #eee}
    .rem-row.sent{opacity:.5}
    .rem-model{font-weight:700;min-width:90px}
    .rem-what{color:var(--grey);font-size:12.5px;flex:1;min-width:120px}
    .rem-actions{display:flex;gap:10px;align-items:center;margin-left:auto}
    .rem-btn{background:#06c755;color:#fff;border:none;border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;font-weight:600}
    .rem-sent-toggle{font-size:12px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px}
    .rem-kind{font-size:10px;font-weight:800;color:#fff;border-radius:3px;padding:1px 5px;margin-right:5px}
    .rem-kind.job{background:var(--teal)} .rem-kind.cast{background:#b8860b}
    .cal-more{color:var(--grey);font-size:10px;margin-top:1px}
    /* Day view (hourly grid) */
    .day-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .board-nav{flex-wrap:wrap}
    .day-nav .d-title{font-weight:700;font-size:16px;min-width:200px}
    .day-nav button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
    .day-allday{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .day-allday .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--grey);margin-right:6px}
    .adchip{border-radius:5px;padding:3px 8px;color:#fff;font-size:11px;cursor:pointer;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .day-grid{display:grid;grid-template-columns:58px 1fr;background:#fff;border:1px solid var(--line);border-radius:8px;max-height:620px;overflow-y:auto}
    .day-hours{border-right:1px solid var(--line)}
    .day-hour{height:48px;font-size:11px;color:var(--grey);text-align:right;padding:2px 8px 0 0;box-sizing:border-box}
    .day-col{position:relative;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,#f1f1f1 47px,#f1f1f1 48px)}
    .day-event{position:absolute;border-radius:6px;padding:3px 7px;color:#fff;font-size:11px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.18);line-height:1.25}
    .day-event .et{font-weight:700} .day-event .em{opacity:.92}
    .ev-cast{background:#b8860b} .ev-opt{background:var(--web)} .ev-job{background:var(--teal)} .ev-fit{background:#6366f1}
    .ev-short{background:#d33} .ev-prio{background:#e67e22} .ev-note{background:#6b6b6b}
    .adchip.ev-cast,.adchip.ev-opt,.adchip.ev-job,.adchip.ev-fit,.adchip.ev-short,.adchip.ev-prio,.adchip.ev-note{color:#fff}
    .day-empty{padding:20px;text-align:center;color:var(--grey)}

    .cal-legend{display:flex;gap:16px;margin:10px 2px 0;font-size:12px;color:var(--grey);flex-wrap:wrap}
    .cal-legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
    .lg-cast::before{background:#b8860b} .lg-fit::before{background:#6366f1} .lg-opt::before{background:var(--web)} .lg-job::before{background:var(--teal)} .lg-short::before{background:#d33} .lg-prio::before{background:#e67e22}

    /* Day detail (in drawer) */
    .day-entry{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
    .day-entry .models{font-weight:700;margin-bottom:8px}
    .day-entry .line{font-size:12.5px;white-space:pre-wrap;margin-bottom:6px}
    .day-entry .line b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}

    @media(max-width:820px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .sched-row{grid-template-columns:1fr}
      .sched-row .k{display:block}
    }
    /* Models directory — lined-up list */
    #m-grid{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .m-row{display:flex;align-items:center;gap:16px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
    .m-row:last-child{border-bottom:none}
    .m-row:hover{background:#f6f9f8}
    .m-r-id{display:flex;align-items:center;gap:9px;min-width:210px;flex-wrap:wrap}
    .m-name{font-weight:700;font-size:14.5px}
    .m-nick{color:var(--grey);font-size:12.5px}
    .m-badge{font-size:10px;font-weight:800;color:#fff;border-radius:4px;padding:2px 6px}
    .m-badge.mp{background:var(--teal)} .m-badge.free{background:#8a8a8a}
    .m-r-meta{display:flex;align-items:center;gap:15px;flex:1;flex-wrap:wrap;font-size:12.5px;color:#444;justify-content:flex-end}
    .m-c{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
    .m-c .ic{opacity:.75}
    .m-missing{color:#c99a3a;font-weight:600}
    .m-visa-soon{color:var(--declined);font-weight:600}
    body.role-booker .m-editor{display:none}
    @media (max-width:640px){.m-r-meta{justify-content:flex-start}}
    .m-chips{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
    .m-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;
      font-weight:600;color:var(--grey);cursor:pointer}
    .m-chip:hover{border-color:var(--teal);color:var(--teal)}
    .m-chip.active{background:var(--teal);border-color:var(--teal);color:#fff}
    .m-status-pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px}
    .st-intown{background:#e8f4ec;color:#1e9a55} .st-outoftown{background:#eef2fb;color:#4a6fbf}
    .st-direct{background:#f6efdd;color:#a97e26} .st-left{background:#f0f0f0;color:#888}
    /* category landing tiles */
    #m-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
    .m-cat-tile{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;
      border:1px solid var(--line);border-radius:13px;padding:20px 22px;cursor:pointer;transition:.12s}
    .m-cat-tile:hover{border-color:var(--teal);box-shadow:0 6px 18px rgba(0,0,0,.07);transform:translateY(-1px)}
    .m-cat-tile .nm{font-size:16px;font-weight:700}
    .m-cat-tile .ct{background:var(--teal);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;flex:none}
    .m-cat-tile.all{background:var(--ink,#16211d);border-color:transparent}
    .m-cat-tile.all .nm{color:#fff} .m-cat-tile.all .ct{background:rgba(255,255,255,.22)}
    #m-backbar{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
    #m-back{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 13px;font-weight:600;color:var(--grey);cursor:pointer;font-size:13px}
    #m-back:hover{color:var(--ink);border-color:var(--teal)}
    #m-crumb{font-weight:700;font-size:16px}
    /* Finance moved to the separate, locked Financial Management app (finance.mpmodelsbkk.com) */
    .num.pos{color:var(--teal)} .num.neg{color:var(--declined)}
  </style>
</head>
<body>

  <!-- Login -->
  <div class="login-wrap" id="login">
    <form class="login-card" id="login-form">
      <img src="images/mp-logo.png" alt="MP Models" onerror="this.style.display='none'">
      <h1>Job Tracker</h1>
      <p>Internal access only</p>
      <input type="email" id="email" placeholder="Email" autocomplete="username"
             autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email" autofocus>
      <div class="pw-wrap">
        <input type="password" id="pw" placeholder="Password" autocomplete="current-password"
               autocapitalize="none" autocorrect="off" spellcheck="false">
        <button type="button" id="pw-toggle" class="pw-toggle" aria-label="Show password">Show</button>
      </div>
      <button class="btn" type="submit" style="width:100%">Sign in</button>
      <p class="login-err" id="login-err"></p>
    </form>
  </div>

  <!-- App -->
  <div class="app" id="app">
    <div class="topbar">
      <img class="brand-logo" src="images/mp-mark-white-120.png?v=3" alt="MP Models" title="MP Models">
      <button class="tab active" data-view="jobs">Job Tracker</button>
      <button class="tab" data-view="schedule">Schedule</button>
      <button class="tab" data-view="models">Models</button>
      <button class="tab" data-view="activity">Activity</button>
      <div class="spacer"></div>
      <span id="whoami" style="color:#ccc;font-size:13px;margin-right:14px"></span>
      <button class="logout" id="logout">Sign out</button>
    </div>

    <!-- JOB TRACKER -->
    <div class="wrap" id="view-jobs">
      <div class="controls">
        <select id="j-month"></select>
        <select id="j-booker"><option value="">All bookers</option></select>
        <select id="j-invtype">
          <option value="">All invoices</option>
          <option value="tax">Tax invoice · C (KBank)</option>
          <option value="nontax">Non-Tax · B (SCB)</option>
        </select>
        <input type="search" id="j-search" placeholder="Search title, model, client, job ID…">
        <div class="right">
          <button class="btn" id="j-add">+ Add job</button>
          <button class="link" id="j-refresh">↻ Refresh</button>
        </div>
      </div>

      <div class="stats" id="j-stats"></div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Job Date</th><th>Job ID<br><span class="th-sub">Tax · C</span></th><th>Job ID<br><span class="th-sub">Non-Tax · B</span></th><th>Title</th><th>Model / Freelance</th>
              <th>Client</th><th>Booker</th><th class="num money">Budget</th>
            </tr>
          </thead>
          <tbody id="j-rows"></tbody>
        </table>
        <div class="empty" id="j-empty" style="display:none">No jobs match.</div>
      </div>
    </div>

    <!-- SCHEDULE -->
    <div class="wrap" id="view-schedule" style="display:none">
      <div class="controls">
        <div class="seg">
          <button class="seg-btn active" id="s-cal-btn">Month</button>
          <button class="seg-btn" id="s-board-btn">Board</button>
          <button class="seg-btn manager-only" id="s-sum-btn">Summary</button>
        </div>
        <select id="s-month"></select>
        <select id="s-booker"><option value="">All bookers</option></select>
        <input type="search" id="s-search" placeholder="Search model or note…">
        <div class="right">
          <button class="btn" id="s-add">+ Add entry</button>
          <button class="link" id="s-refresh">↻ Refresh</button>
        </div>
      </div>
      <div id="s-calendar"></div>
      <div id="s-board" style="display:none"></div>
      <div id="s-day" style="display:none"></div>
      <div id="s-history" style="display:none"></div>
      <div id="s-list" style="display:none"></div>
      <div id="s-summary" style="display:none"></div>
      <div class="empty" id="s-empty" style="display:none">No schedule entries.</div>
    </div>

    <!-- MODELS DIRECTORY (contacts — no money) -->
    <div class="wrap" id="view-models" style="display:none">
      <div class="controls">
        <input type="search" id="m-search" placeholder="Search name, nickname, country…" style="min-width:190px">
        <select id="m-cat"><option value="">All categories</option></select>
        <select id="m-sex"><option value="">All</option><option>Female</option><option>Male</option><option>Transgender</option></select>
        <input id="m-country" list="m-country-list" placeholder="Country / nationality…" autocomplete="off" style="min-width:160px">
        <datalist id="m-country-list"></datalist>
        <div class="right">
          <button class="btn m-editor" id="m-add">+ Add model</button>
          <button class="link" id="m-refresh">↻ Refresh</button>
        </div>
      </div>
      <div id="m-backbar" style="display:none">
        <button id="m-back">‹ All categories</button>
        <span id="m-crumb"></span>
      </div>
      <div class="m-chips" id="m-status-chips" style="display:none">
        <button class="m-chip active" data-st="">All</button>
        <button class="m-chip" data-st="In town">📍 In town</button>
        <button class="m-chip" data-st="Out of town">✈ Out of town</button>
        <button class="m-chip" data-st="Direct booking">⚡ Direct booking</button>
        <button class="m-chip" data-st="Left">Left</button>
      </div>
      <p id="m-count" style="color:var(--grey);font-size:12.5px;margin:2px 0 12px"></p>
      <div id="m-cats"></div>
      <div id="m-grid" style="display:none"></div>
      <div class="empty" id="m-empty" style="display:none">No models yet.</div>
    </div>

    <!-- ACTIVITY (whole team) -->
    <div class="wrap" id="view-activity" style="display:none">
      <div class="controls">
        <select id="a-type">
          <option value="changes">Changes (no logins)</option>
          <option value="schedule">Schedule only</option>
          <option value="jobs">Jobs only</option>
          <option value="logins">Logins only</option>
          <option value="all">Everything</option>
        </select>
        <select id="a-user"><option value="">All users</option></select>
        <input type="search" id="a-search" placeholder="Search action or detail…">
        <div class="right"><button class="link" id="a-refresh">↻ Refresh</button></div>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>When</th><th>User</th><th>Role</th><th>Action</th><th>Detail</th></tr></thead>
          <tbody id="a-rows"></tbody>
        </table>
        <div class="empty" id="a-empty" style="display:none">No activity yet.</div>
      </div>
    </div>
  </div>

  <!-- Floating "Tomorrow" reminder — a help-box bubble, bottom-left, on every tab -->
  <div id="rem-launcher" style="display:none">
    <div id="rem-pop" class="rem-pop" style="display:none">
      <div class="rem-pop-head">
        <span>Reminders</span>
        <button class="x" id="rem-close">&times;</button>
      </div>
      <div id="s-reminders"></div>
    </div>
    <button id="rem-toggle" class="rem-fab" title="Tomorrow's models to notify">
      <span class="rem-fab-bell">🔔</span><span id="rem-count" class="rem-fab-badge">0</span>
    </button>
  </div>

  <!-- Drawer (job detail/edit + add) -->
  <div class="drawer-bg" id="drawer-bg"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <h2 id="d-title">Job</h2>
      <button class="x" id="d-close">&times;</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>

  <script src="js/confirmation.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
